<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RESTORE">
<meta name="theme-color" content="#FBFAF7">
</head>
<body>
<title>RESTORE → REBUILD</title>
<style>
  :root{
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#15181A; --ink-soft:#3A4144;
    --muted:#767B7C; --line:#E5E3DD; --line-soft:#F0EEE9;
    --accent:#3D5A54; --accent-tint:#EAF0ED; --chip:#FFFFFF;
    --shadow:0 1px 2px rgba(21,24,26,.04);
    --sans:"Inter","Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#101413; --card:#171B1A; --ink:#EDEEEA; --ink-soft:#C6CAC6;
      --muted:#8B9391; --line:#262B2A; --line-soft:#1F2423;
      --accent:#8FBDB0; --accent-tint:#1A2422; --chip:#1B211F; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --paper:#101413; --card:#171B1A; --ink:#EDEEEA; --ink-soft:#C6CAC6;
    --muted:#8B9391; --line:#262B2A; --line-soft:#1F2423;
    --accent:#8FBDB0; --accent-tint:#1A2422; --chip:#1B211F; --shadow:none;
  }
  :root[data-theme="light"]{
    --paper:#FBFAF7; --card:#FFFFFF; --ink:#15181A; --ink-soft:#3A4144;
    --muted:#767B7C; --line:#E5E3DD; --line-soft:#F0EEE9;
    --accent:#3D5A54; --accent-tint:#EAF0ED; --chip:#FFFFFF;
    --shadow:0 1px 2px rgba(21,24,26,.04);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .shell{max-width:760px; margin:0 auto; padding:0 20px 80px}

  /* ---------- Phase tabs ---------- */
  .phases{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:26px 0 0}
  .ptab{
    display:flex; flex-direction:column; gap:5px; text-align:left;
    padding:13px 15px; cursor:pointer; font:inherit;
    background:var(--chip); border:1px solid var(--line); border-radius:4px;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .ptab-n{font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .ptab-name{font-size:15px; font-weight:750; letter-spacing:-.02em; color:var(--ink)}
  .ptab-meta{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .ptab[aria-selected="true"]{border-color:var(--accent); background:var(--accent-tint)}
  .ptab[aria-selected="true"] .ptab-n{color:var(--accent)}
  .ptab:hover{border-color:var(--muted)}
  .ptab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- Masthead ---------- */
  .masthead{display:flex; flex-direction:column; gap:20px; padding:34px 0 28px}
  .eyebrow{margin:0; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:700}
  .wordmark{margin:0; font-size:clamp(44px,13vw,74px); line-height:.88; font-weight:800; letter-spacing:-.04em; text-wrap:balance}
  .standfirst{margin:0; font-size:16px; line-height:1.45; color:var(--muted); max-width:36ch; text-wrap:balance}
  .client{margin:0; display:flex; align-items:center; gap:10px; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .client b{color:var(--accent); font-weight:700; letter-spacing:.08em}
  .client::before{content:""; width:18px; height:1px; background:var(--line); flex:none}
  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:18px 24px; padding-top:22px; border-top:1px solid var(--line); margin:0}
  .stats div{display:flex; flex-direction:column; gap:5px}
  .stats dt{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .stats dd{margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; font-variant-numeric:tabular-nums}

  /* ---------- Sticky day nav ---------- */
  .daynav{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    margin:0 -20px; padding:10px 20px;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .daynav ul{display:flex; gap:7px; list-style:none; margin:0; padding:0; overflow-x:auto; scrollbar-width:none}
  .daynav ul::-webkit-scrollbar{display:none}
  .daynav a{
    display:block; padding:8px 13px; border-radius:999px;
    background:var(--chip); border:1px solid var(--line);
    font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); text-decoration:none; white-space:nowrap;
    transition:color .15s ease, border-color .15s ease, background-color .15s ease;
  }
  .daynav a:hover{color:var(--ink); border-color:var(--muted)}
  .daynav a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .daynav a[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--paper)}
  .daynav a.is-today::after{content:""; display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--accent); margin-left:6px; vertical-align:middle}
  .daynav a.is-today[aria-current="true"]::after{background:var(--paper)}

  .rubric{display:flex; align-items:center; gap:14px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:0}
  .rubric::after{content:""; flex:1; height:1px; background:var(--line)}

  /* ---------- Tracker ---------- */
  .tracker{display:flex; flex-direction:column; gap:18px; padding:34px 0 0}
  .tracker-top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:18px}
  .counts{display:flex; gap:24px; flex-wrap:wrap; margin:0}
  .counts div{display:flex; flex-direction:column; gap:4px}
  .count-n{font-size:27px; font-weight:800; letter-spacing:-.035em; line-height:1; font-variant-numeric:tabular-nums}
  .count-n.muted{color:var(--muted); font-size:20px}
  .count-l{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .startline{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .startline input{
    font:inherit; font-size:12px; letter-spacing:0; text-transform:none; font-weight:600;
    color:var(--ink); background:var(--card); border:1px solid var(--line);
    border-radius:3px; padding:6px 8px;
  }
  .startline input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .bar{height:4px; background:var(--line); border-radius:999px; overflow:hidden}
  .bar span{display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .35s ease}
  @media (prefers-reduced-motion: reduce){ .bar span{transition:none} }
  .cal{display:flex; flex-direction:column; gap:7px}
  .dow, .week{display:grid; grid-template-columns:repeat(7,1fr); gap:7px}
  .dow span{font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; text-align:center}
  .cell{
    aspect-ratio:1/1; padding:0; cursor:pointer;
    border:1px solid var(--line); border-radius:3px; background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font:inherit; font-variant-numeric:tabular-nums;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .cell b{font-size:13px; font-weight:700; letter-spacing:-.02em; color:var(--ink-soft)}
  .cell i{width:4px; height:4px; border-radius:50%; background:var(--muted); font-style:normal}
  .cell.lift i{background:var(--accent)}
  .cell.future{opacity:.4}
  .cell.future.done{opacity:1}
  .cell.done{background:var(--accent); border-color:var(--accent)}
  .cell.done b{color:var(--paper)}
  .cell.done i{background:var(--paper); opacity:.55}
  .cell.today{box-shadow:0 0 0 2px var(--accent)}
  .cell:hover{border-color:var(--muted)}
  .cell:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .legend{display:flex; align-items:center; gap:18px; flex-wrap:wrap; font-size:11.5px; color:var(--muted)}
  .legend span{display:flex; align-items:center; gap:7px}
  .legend i{width:6px; height:6px; border-radius:50%; background:var(--muted); font-style:normal}
  .legend i.lift{background:var(--accent)}
  .reset{margin-left:auto; padding:0; border:0; background:none; cursor:pointer; font:inherit; font-size:11.5px; color:var(--muted); text-decoration:underline}
  .reset:hover{color:var(--ink)}
  .reset:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- Glance ---------- */
  .glance{display:flex; flex-direction:column; gap:16px; padding:34px 0 0}
  .glance-list{display:flex; flex-direction:column; margin:0}
  .glance-list a{
    display:grid; grid-template-columns:56px 1fr; gap:2px 14px; align-items:baseline;
    padding:12px 0; border-bottom:1px solid var(--line-soft); text-decoration:none; color:inherit;
  }
  .glance-list a:first-child{border-top:1px solid var(--line-soft)}
  .glance-list a:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  .gl-day{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .gl-name{font-weight:650; letter-spacing:-.01em}
  .gl-note{grid-column:2; font-size:12.5px; color:var(--muted)}

  /* ---------- Days ---------- */
  .days{display:flex; flex-direction:column; gap:16px; padding:38px 0 0}
  .day{
    scroll-margin-top:74px;
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    box-shadow:var(--shadow); padding:24px 22px 22px;
    display:flex; flex-direction:column; gap:20px;
  }
  .day.rest{background:var(--accent-tint); border-color:transparent; box-shadow:none}
  .day-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding-bottom:14px; border-bottom:1.5px solid var(--ink)}
  .day.rest .day-head{border-bottom-color:var(--accent)}
  .day-name{margin:0; font-size:21px; font-weight:750; letter-spacing:-.025em; flex:1}
  .day-tag{
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    color:var(--accent); background:var(--accent-tint); padding:5px 10px; border-radius:2px; white-space:nowrap;
  }
  .day.rest .day-tag{background:transparent; padding:5px 0}
  .block{display:flex; flex-direction:column; gap:2px}
  .block-label{margin:0 0 4px; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .ex{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
  .ex li{display:grid; grid-template-columns:1fr auto; gap:2px 16px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line-soft)}
  .day.rest .ex li{border-bottom-color:var(--line)}
  .ex li:last-child{border-bottom:none; padding-bottom:0}
  .nm{font-weight:550}
  .cue{grid-column:1 / -1; font-size:12.5px; line-height:1.45; color:var(--muted)}
  .rx{font-size:13px; font-weight:750; white-space:nowrap; letter-spacing:-.01em; font-variant-numeric:tabular-nums; color:var(--ink-soft); text-align:right}
  .lead{margin:0; display:flex; flex-direction:column; gap:5px}
  .lead b{font-size:19px; font-weight:700; letter-spacing:-.02em}
  .lead span{font-size:13.5px; color:var(--muted)}
  .notes{margin:0; padding:0 0 0 16px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--muted); line-height:1.5}
  .notes li::marker{color:var(--accent)}
  .log{display:none}

  /* ---------- Progression ---------- */
  .progression{display:flex; flex-direction:column; gap:16px; padding:44px 0 0}
  .weeks{display:grid; grid-template-columns:1fr; gap:12px}
  .wk{border:1px solid var(--line); border-radius:4px; background:var(--card); box-shadow:var(--shadow); padding:18px 20px; display:flex; flex-direction:column; gap:10px}
  .wk.current{border-color:var(--accent)}
  .wk-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .wk-n{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--muted)}
  .rpe{font-size:11px; font-weight:750; letter-spacing:.03em; color:var(--accent); background:var(--accent-tint); padding:4px 9px; border-radius:2px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .wk p{margin:0; color:var(--ink-soft)}

  /* ---------- Closing ---------- */
  .closing{display:flex; flex-direction:column; gap:16px; padding:44px 0 0}
  .rules{
    border:1px solid var(--line); border-left:2px solid var(--accent); border-radius:4px;
    background:var(--card); padding:20px 22px; display:flex; flex-direction:column; gap:12px;
  }
  .rules h3{margin:0; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:700}
  .rules ul{margin:0; padding:0 0 0 16px; display:flex; flex-direction:column; gap:7px; color:var(--ink-soft); font-size:14px}
  .rules li::marker{color:var(--accent)}
  .outcome{margin:0; font-size:13.5px; line-height:1.6; color:var(--ink-soft)}
  .outcome b{color:var(--accent)}
  .colophon{margin:0; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); line-height:1.6}
  .colophon b{color:var(--ink-soft); font-weight:650}

  @media (min-width:640px){
    body{font-size:15.5px}
    .stats{grid-template-columns:repeat(4,1fr)}
    .glance-list a{grid-template-columns:60px 1fr auto; gap:14px}
    .gl-note{grid-column:auto; text-align:right}
    .day{padding:28px 30px 26px}
    .weeks{grid-template-columns:1fr 1fr}
  }

  /* ---------- Print: both phases, full document ---------- */
  @page{ size:A4; margin:15mm 14mm; }
  @media print{
    :root{
      --paper:#fff; --card:#fff; --ink:#15181A; --ink-soft:#3A4144; --muted:#767B7C;
      --line:#E0DDD6; --line-soft:#EFEDE8; --accent:#3D5A54; --accent-tint:#EEF3F1; --shadow:none;
    }
    body{background:#fff; font-size:11.5px; padding:0}
    .shell{max-width:none; padding:0}
    .daynav, .phases, .reset, .startline input{display:none}
    .phase[hidden]{display:block !important}
    .phase + .phase{break-before:page}
    .masthead{padding-top:6mm}
    .wordmark{font-size:64px}
    .day, .wk, .tracker, .rules{break-inside:avoid}
    .day{border-radius:0; padding:18px 20px 16px}
    .log{display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid var(--line)}
    .log-lines{display:flex; flex-direction:column}
    .log-lines span{display:block; height:22px; border-bottom:1px solid var(--line-soft)}
    .progression{break-before:page}
    a{color:inherit; text-decoration:none}
  }
</style>

<div class="shell" id="shell"></div>

              ['Dumbbell lateral raise', '3×12–15'], ['Rope triceps pushdown', '3×10–15'],

          ],
          notes: ['Weeks 5–6: RPE 7', 'Week 7: RPE 8', 'Week 8: RPE 6–7'] },

        { title: 'Lower A', tag: 'Lower A', type: 'lift', note: 'Strength + hypertrophy + core',
          blocks: [
            ['Warm-up / mobility', [
              ['90/90 hip switches', '2×8 / side'], ['Hip CARs', '5 / side'],
              ["World's Greatest Stretch", '2×5 / side'], ['Glute bridge', '2×12'],
              ['Knee-to-wall dorsiflexion', '2×10 / side'], ['Tibialis raises', '2×15']]],
            ['Strength', [['Romanian deadlift', '4×6–8'], ['Leg press', '4×8–10']]],
            ['Hypertrophy', [
              ['Seated leg curl', '3×10–12'], ['Leg extension', '3×10–15'],
              ['Standing calf raise', '4×12–15']]],
            ['Core', [['Pallof press', '3×10–12 / side'], ['Front plank', '3×40–60 s']]],
            ['Post-session mobility', [
              ['Couch stretch', '2×30 s / side'], ['Supine hamstring stretch', '2×30 s / side'],
              ['Calf stretch', '2×30 s / side']]]
          ] },

        { title: 'Dedicated mobility', tag: 'Mobility', type: 'rest', note: 'Mobility + easy cardio',
          lead: ['Bike 10–15 km · Zone 2', 'Conversational pace. This is a recovery day.'],
          blocks: [['Mobility', [
            ['90/90 hip switches', '2×10 / side'], ['90/90 forward fold', '2×30 s / side'],
            ['Hip CARs', '2×5 / side'], ['Frog stretch', '2×30–45 s'],
            ['Knee-to-wall', '2×10 / side'], ['Tibialis raises', '2×15'],
            ['Calf stretch', '2×30 s / side'], ['Open book', '2×8 / side'],
            ['Thread the needle', '2×8 / side'], ['Half-kneeling T-spine rotation', '2×8 / side'],
            ['Wall slides', '2×10'], ['Banded external rotation', '2×12–15'],
            ['Passive / active dead hang', '2×20–30 s'], ['90/90 breathing', '3–5 min']]]],
          notes: ['Finish feeling better than when you started.', 'Keep the cardio easy — this is a recovery day.'] },

        { title: 'Upper B', tag: 'Upper B', type: 'lift', note: 'Pull strength + hypertrophy',
          blocks: [
            ['Warm-up / mobility', [
              ['Bike', '5–7 min'], ['Wall slides', '2×10'], ['Shoulder pass-throughs', '2×10'],
              ['Open book', '2×8 / side'], ['Band pull-aparts', '2×20'], ['Scapular push-ups', '2×10']]],
            ['Strength', [
              ['Pull-up / neutral-grip lat pulldown', '4×6–8'], ['Seated cable row', '4×8–10']]],
            ['Hypertrophy', [
              ['Pec deck', '3×10–12'], ['Reverse cable rear delt', '3×12–15'],
              ['Cable lateral raise', '3×12–15'], ['EZ-bar curl', '3×10–12'],
              ['Rope overhead triceps extension', '3×10–15']]]
          ],
          notes: ['Optional: Dips — 2×8–12, only if completely comfortable.',
                  'Weeks 5–6: RPE 7 · Week 7: RPE 8 · Week 8: RPE 6–7'] },

        { title: 'Lower B', tag: 'Lower B', type: 'lift', note: 'Posterior chain + core',
          blocks: [
            ['Warm-up / mobility', [
              ['90/90 hip switches', '2×8 / side'], ["World's Greatest Stretch", '2×5 / side'],
              ['Hip CARs', '5 / side'], ['Glute bridge', '2×12'],
              ['Knee-to-wall', '2×10 / side'], ['Tibialis raises', '2×15']]],
            ['Strength', [['Hip thrust', '4×6–8'], ['Reverse lunge', '3×8–10 / leg']]],
            ['Hypertrophy', [
              ['Lying leg curl', '3×10–15'], ['Cable glute kickback', '3×12–15'],
              ['Leg press calf raise', '4×12–20']]],
            ['Core', [['Bird dog', '3×10 / side'], ['Side plank', '3×30–45 s / side']]],
            ['Post-session mobility', [
              ['Couch stretch', '2×30 s / side'], ['Frog stretch', '2×30 s'],
              ['Hamstring stretch', '2×30 s / side'], ['Hip flexor stretch', '2×30 s / side']]]
          ],
          notes: ['If the reverse lunge is uncomfortable, swap it for Leg Press — 3×10.'] },

        { title: 'Plyometrics + run', tag: 'Power', type: 'lift', note: 'Power + running + mobility',
          blocks: [
            ['Warm-up / mobility', [
              ['Easy jog', '3–5 min'], ['Ankle rocks', '10 / side'], ['Leg swings', '10 / side'],
              ['Hip CARs', '5 / side'], ["World's Greatest Stretch", '5 / side'],
              ['Glute bridge', '2×10'], ['Calf raises', '2×15'], ['A-skips', '2×15–20 m']]],
            ['Power', [
              ['Pogo jumps', '3×15–20'], ['Squat jump', '3×5'], ['Broad jump', '3×4'],
              ['Low box jump', '3×4–5'], ['Skater bounds', '2×6 / side']]],
            ['Run', [
              ['Week 5', '5 km'], ['Week 6', '6 km'], ['Week 7', '7 km'],
              ['Week 8', '5 km', 'Deload.']]],
            ['Post-session mobility', [
              ['Couch stretch', '2×30 s / side'], ['Frog stretch', '2×30 s'],
              ['Supine hamstring stretch', '2×30 s / side'], ['Calf stretch', '2×30 s / side'],
              ['90/90 stretch', '2×30 s / side'], ['Half-kneeling T-spine rotation', '2×8 / side'],
              ['90/90 breathing', '2–3 min']]]
          ],
          notes: ['Rest ~60–90 sec between plyometric sets.',
                  'Power, not exhaustion. Quiet, controlled landings.',
                  'Keep the run conversational — this block rebuilds running capacity, it is not a race.'] },

        { title: 'Long Zone 2 cycling', tag: 'Aerobic', type: 'rest', note: 'Aerobic base + recovery',
          lead: ['Zone 2 · long ride', 'Comfortable, conversational pace throughout.'],
          blocks: [
            ['Distance by week', [
              ['Week 5', '40 km'], ['Week 6', '45 km'], ['Week 7', '50 km'],
              ['Week 8', '35–40 km', 'Deload.']]],
            ['Finish · 15–20 min', [
              ['Frog stretch'], ['Couch stretch'], ['Hamstring stretch'], ['Calf stretch'],
              ['90/90 hip stretch'], ['Thoracic rotation'], ['Light shoulder mobility']]]
          ] }
      ],
      progression: [
        ['Week 5 · Reintroduce', 'RPE 7', 'Plyo low volume · Run 5 km · Bike 40 km.'],
        ['Week 6 · Build', 'RPE 7–7.5', 'Improve output · Run 6 km · Bike 45 km.'],
        ['Week 7 · Strongest', 'RPE 8', 'Highest quality plyo volume · Run 7 km · Bike 50 km.'],
        ['Week 8 · Deload', 'RPE 6–7', 'Cut lifting sets 25–35% · Plyo 50–60% volume · Run 5 km · Bike 35–40 km.']
      ],
      rules: {
        title: 'Non-negotiables',
        items: [
          'Quality reps over ego lifting.',
          'Plyometrics stay explosive and controlled — not conditioning circuits.',
          'Mobility is a session, not an afterthought.',
          'Zone 2 stays easy enough for conversation.',
          'Progress load or reps only when recovery and technique support it.',
          'Week 8 is a deload, so the next block starts fresh.'
        ]
      },
      load: {
        title: 'Load progression',
        items: [
          'Hit the top of the rep range on every set with clean form at the target RPE? Add a little load next time.',
          'Reps below the top of the range? Keep the load and build reps.',
          'Do not increase weight just because the calendar says so.',
          'No failure training during this block.'
        ]
      },
      outcome: 'By the end of Week 8 — <b>strength ↑ · hypertrophy volume ↑ · running tolerance ↑ · aerobic capacity ↑ · explosive power ↑ · mobility and control ↑ · training capacity ↑</b>',
      colophon: '<b>No failure.</b> Keep roughly 2–3 good reps in reserve on most work across this block.'
    }
  ];

  var TOTAL = 28;

  /* ---------- Per-client personalisation from the link ---------- */
  var params = new URLSearchParams(location.search);
  var clientName = (params.get('client') || '').trim().slice(0, 40);
  var startParam = /^\d{4}-\d{2}-\d{2}$/.test(params.get('start') || '') ? params.get('start') : null;
  if (clientName) document.title = clientName + ' — RESTORE → REBUILD';

  /* ---------- Storage ---------- */
  var suffix = clientName ? ':' + clientName.toLowerCase() : '';
  function keyFor(id) { return 'training:' + id + '-v1' + suffix; }

  function loadState(id) {
    var s = { start: null, done: {} };
    try {
      var raw = localStorage.getItem(keyFor(id));
      if (raw) { var p = JSON.parse(raw); s.start = p.start || null; s.done = p.done || {}; }
    } catch (e) { /* private mode — progress just won't persist */ }
    return s;
  }
  function saveState(id, s) {
    try { localStorage.setItem(keyFor(id), JSON.stringify(s)); } catch (e) {}
  }

  function toISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }
  function fromISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  /* ---------- Tiny DOM helper ---------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  /* ---------- Build one phase ---------- */
  function buildPhase(phase, index) {
    var state = loadState(phase.id);
    if (!state.start) state.start = startParam || toISO(today());

    var root = el('section', { class: 'phase', id: phase.id });
    if (index !== 0) root.hidden = true;

    /* Masthead */
    var mast = el('header', { class: 'masthead' }, [
      el('p', { class: 'eyebrow', text: 'Training program · Phase ' + phase.numeral }),
      el('h1', { class: 'wordmark', text: phase.name }),
      el('p', { class: 'standfirst', text: phase.standfirst })
    ]);
    if (clientName) {
      mast.appendChild(el('p', { class: 'client', html: 'Prepared for <b></b>' }));
      mast.querySelector('.client b').textContent = clientName;
    }
    var dl = el('dl', { class: 'stats' });
    phase.stats.forEach(function (s) {
      dl.appendChild(el('div', null, [el('dt', { text: s[0] }), el('dd', { text: s[1] })]));
    });
    mast.appendChild(dl);
    root.appendChild(mast);

    /* Day nav */
    var navUl = el('ul');
    phase.days.forEach(function (d, i) {
      navUl.appendChild(el('li', null, [
        el('a', { href: '#' + phase.id + '-d' + (i + 1), 'data-slot': i + 1, text: 'Day ' + (i + 1) })
      ]));
    });
    root.appendChild(el('nav', { class: 'daynav', 'aria-label': 'Jump to a session' }, [navUl]));

    /* Tracker */
    var counts = el('div', { class: 'counts' });
    var refs = {};
    [['day', 'Day of 28'], ['done', 'Completed'], ['left', 'Remaining'], ['week', 'Week']]
      .forEach(function (c) {
        var n = el('span', { class: 'count-n', text: '0' });
        refs[c[0]] = n;
        counts.appendChild(el('div', null, [n, el('span', { class: 'count-l', text: c[1] })]));
      });

    var startInput = el('input', { type: 'date', value: state.start });
    var barFill = el('span');
    var weeksWrap = el('div');
    var resetBtn = el('button', { class: 'reset', type: 'button', text: 'Reset progress' });

    var dow = el('div', { class: 'dow', 'aria-hidden': 'true' });
    for (var i = 1; i <= 7; i++) dow.appendChild(el('span', { text: String(i) }));

    var cells = [];
    for (var w = 0; w < 4; w++) {
      var row = el('div', { class: 'week' });
      for (var j = 0; j < 7; j++) {
        var n = w * 7 + j + 1;
        var b = el('button', {
          type: 'button',
          class: 'cell' + (phase.days[j].type === 'lift' ? ' lift' : ''),
          'data-n': n
        }, [el('b', { text: String(n) }), el('i')]);
        row.appendChild(b);
        cells.push(b);
      }
      weeksWrap.appendChild(row);
    }

    var tracker = el('section', { class: 'tracker' }, [
      el('h2', { class: 'rubric', text: 'Your 28 days' }),
      el('div', { class: 'tracker-top' }, [
        counts,
        el('label', { class: 'startline', text: 'Started' }, [startInput])
      ]),
      el('div', { class: 'bar' }, [barFill]),
      el('div', { class: 'cal' }, [dow, weeksWrap]),
      el('div', { class: 'legend' }, [
        el('span', null, [el('i', { class: 'lift' }), document.createTextNode('Training session')]),
        el('span', null, [el('i'), document.createTextNode('Mobility · cardio')]),
        resetBtn
      ])
    ]);
    root.appendChild(tracker);

    /* Week at a glance */
    var glist = el('div', { class: 'glance-list' });
    phase.days.forEach(function (d, i) {
      glist.appendChild(el('a', { href: '#' + phase.id + '-d' + (i + 1) }, [
        el('span', { class: 'gl-day', text: 'Day ' + (i + 1) }),
        el('span', { class: 'gl-name', text: d.title }),
        el('span', { class: 'gl-note', text: d.note || '' })
      ]));
    });
    root.appendChild(el('section', { class: 'glance' }, [
      el('h2', { class: 'rubric', text: 'The week at a glance' }), glist
    ]));

    /* Days */
    var daysWrap = el('div', { class: 'days' });
    phase.days.forEach(function (d, i) {
      var sec = el('section', {
        class: 'day' + (d.type === 'rest' ? ' rest' : ''),
        id: phase.id + '-d' + (i + 1)
      });
      sec.appendChild(el('div', { class: 'day-head' }, [
        el('h2', { class: 'day-name', text: 'Day ' + (i + 1) }),
        el('span', { class: 'day-tag', text: d.tag })
      ]));
      if (d.lead) {
        sec.appendChild(el('p', { class: 'lead' }, [
          el('b', { text: d.lead[0] }), el('span', { text: d.lead[1] })
        ]));
      }
      (d.blocks || []).forEach(function (blk) {
        var ul = el('ul', { class: 'ex' });
        blk[1].forEach(function (it) {
          var li = el('li', null, [el('span', { class: 'nm', text: it[0] })]);
          if (it[1]) li.appendChild(el('span', { class: 'rx', text: it[1] }));
          if (it[2]) li.appendChild(el('span', { class: 'cue', text: it[2] }));
          ul.appendChild(li);
        });
        sec.appendChild(el('div', { class: 'block' }, [
          el('h3', { class: 'block-label', text: blk[0] }), ul
        ]));
      });
      if (d.notes) {
        var nul = el('ul', { class: 'notes' });
        d.notes.forEach(function (t) { nul.appendChild(el('li', { text: t })); });
        sec.appendChild(el('div', { class: 'block' }, [
          el('h3', { class: 'block-label', text: 'Session notes' }), nul
        ]));
      }
      if (d.type === 'lift') {
        sec.appendChild(el('div', { class: 'log' }, [
          el('h3', { class: 'block-label', text: 'Log' }),
          el('div', { class: 'log-lines' }, [el('span'), el('span'), el('span')])
        ]));
      }
      daysWrap.appendChild(sec);
    });
    root.appendChild(daysWrap);

    /* Progression */
    var weeksGrid = el('div', { class: 'weeks' });
    var wkCards = [];
    phase.progression.forEach(function (p) {
      var card = el('div', { class: 'wk' }, [
        el('div', { class: 'wk-top' }, [
          el('span', { class: 'wk-n', text: p[0] }),
          el('span', { class: 'rpe', text: p[1] })
        ]),
        el('p', { text: p[2] })
      ]);
      wkCards.push(card);
      weeksGrid.appendChild(card);
    });
    root.appendChild(el('section', { class: 'progression' }, [
      el('h2', { class: 'rubric', text: 'Weekly progression' }), weeksGrid
    ]));

    /* Closing */
    var closing = el('section', { class: 'closing' });
    var hasClosing = false;
    [phase.rules, phase.load].forEach(function (grp) {
      if (!grp) return;
      hasClosing = true;
      var ul = el('ul');
      grp.items.forEach(function (t) { ul.appendChild(el('li', { text: t })); });
      closing.appendChild(el('div', { class: 'rules' }, [
        el('h3', { text: grp.title }), ul
      ]));
    });
    if (phase.outcome) {
      hasClosing = true;
      closing.appendChild(el('p', { class: 'outcome', html: phase.outcome }));
    }
    if (phase.colophon) {
      hasClosing = true;
      closing.appendChild(el('p', { class: 'colophon', html: phase.colophon }));
    }
    if (hasClosing) {
      closing.insertBefore(el('h2', { class: 'rubric', text: 'Block reference' }), closing.firstChild);
      root.appendChild(closing);
    }

    /* ---------- Behaviour ---------- */
    var navLinks = Array.prototype.slice.call(navUl.querySelectorAll('a'));

    function currentDay() {
      return Math.round((today() - fromISO(state.start)) / 86400000) + 1;
    }

    function render() {
      var cur = currentDay();
      var doneCount = 0;
      Object.keys(state.done).forEach(function (k) { if (state.done[k]) doneCount++; });

      cells.forEach(function (b) {
        var n = Number(b.getAttribute('data-n'));
        var d = phase.days[(n - 1) % 7];
        var isDone = !!state.done[n];
        b.classList.toggle('done', isDone);
        b.classList.toggle('today', n === cur);
        b.classList.toggle('future', n > cur);
        b.setAttribute('aria-pressed', isDone ? 'true' : 'false');
        b.setAttribute('aria-label',
          'Day ' + n + ', ' + d.title + ', ' + (isDone ? 'completed' : 'not completed'));
      });

      var shown = Math.min(Math.max(cur, 1), TOTAL);
      var wk = Math.ceil(shown / 7);
      var outside = cur < 1 || cur > TOTAL;

      refs.day.textContent = cur < 1 ? 'Not started' : (cur > TOTAL ? 'Finished' : shown);
      refs.day.classList.toggle('muted', outside);
      refs.done.textContent = doneCount;
      refs.left.textContent = TOTAL - doneCount;
      refs.week.textContent = wk;
      barFill.style.width = (doneCount / TOTAL * 100) + '%';

      wkCards.forEach(function (c, k) { c.classList.toggle('current', !outside && k === wk - 1); });

      var slot = outside ? 0 : ((cur - 1) % 7) + 1;
      navLinks.forEach(function (a) {
        a.classList.toggle('is-today', Number(a.getAttribute('data-slot')) === slot);
      });

      if (onProgress) onProgress(phase.id, doneCount);
    }

    weeksWrap.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.cell') : null;
      if (!b) return;
      var n = b.getAttribute('data-n');
      state.done[n] = !state.done[n];
      saveState(phase.id, state);
      render();
    });
    startInput.addEventListener('change', function () {
      if (!startInput.value) return;
      state.start = startInput.value;
      saveState(phase.id, state);
      render();
    });
    resetBtn.addEventListener('click', function () {
      if (!window.confirm('Clear every completed day in Phase ' + phase.numeral + '? This cannot be undone.')) return;
      state.done = {};
      saveState(phase.id, state);
      render();
    });

    /* Scroll-spy */
    var sections = Array.prototype.slice.call(daysWrap.querySelectorAll('.day'));
    var visible = {};
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { visible[en.target.id] = en.isIntersecting; });
        var active = sections.filter(function (s) { return visible[s.id]; })[0];
        navLinks.forEach(function (a) {
          a.setAttribute('aria-current',
            active && a.getAttribute('href') === '#' + active.id ? 'true' : 'false');
        });
      }, { rootMargin: '-80px 0px -55% 0px' });
      sections.forEach(function (s) { io.observe(s); });
    }

    return { root: root, render: render };
  }

  /* ---------- Assemble ---------- */
  var shell = document.getElementById('shell');
  var tabsWrap = el('div', { class: 'phases', role: 'tablist', 'aria-label': 'Training phase' });
  shell.appendChild(tabsWrap);

  var built = [];
  var tabs = [];
  var onProgress = null;

  PROGRAM.forEach(function (phase, i) {
    var meta = el('span', { class: 'ptab-meta', text: '0 / 28 days' });
    var tab = el('button', {
      class: 'ptab', type: 'button', role: 'tab',
      'aria-selected': i === 0 ? 'true' : 'false',
      'aria-controls': phase.id
    }, [
      el('span', { class: 'ptab-n', text: 'Phase ' + phase.numeral }),
      el('span', { class: 'ptab-name', text: phase.name }),
      meta
    ]);
    tab.__meta = meta;
    tabs.push(tab);
    tabsWrap.appendChild(tab);
  });

  onProgress = function (id, done) {
    var idx = PROGRAM.map(function (p) { return p.id; }).indexOf(id);
    if (idx < 0) return;
    tabs[idx].__meta.textContent = done + ' / 28 days · ' + PROGRAM[idx].weeks;
  };

  PROGRAM.forEach(function (phase, i) {
    var p = buildPhase(phase, i);
    built.push(p);
    shell.appendChild(p.root);
  });

  function show(i) {
    built.forEach(function (p, k) { p.root.hidden = k !== i; });
    tabs.forEach(function (t, k) { t.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
    try { localStorage.setItem('training:phase' + suffix, String(i)); } catch (e) {}
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  tabs.forEach(function (t, i) { t.addEventListener('click', function () { show(i); }); });

  built.forEach(function (p) { p.render(); });

  /* Open on the phase the user was last in, or the one pointed at by the link. */
  var wanted = 0;
  var hash = (location.hash || '').replace('#', '');
  var byHash = PROGRAM.map(function (p) { return p.id; }).indexOf(hash.split('-')[0]);
  if (byHash >= 0) wanted = byHash;
  else {
    try {
      var saved = localStorage.getItem('training:phase' + suffix);
      if (saved !== null && PROGRAM[+saved]) wanted = +saved;
    } catch (e) {}
  }
  show(wanted);
  if (byHash >= 0 && hash.indexOf('-d') > -1) {
    var target = document.getElementById(hash);
    if (target) target.scrollIntoView();
  }
})();
</script>

</body>
